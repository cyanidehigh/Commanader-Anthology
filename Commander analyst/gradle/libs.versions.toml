[versions]
agp = "8.13.0"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
composeMultiplatform = "1.8.2"
coreKtx = "1.17.0"
lifecycle = "2.9.2"
activityCompose = "1.10.1"
